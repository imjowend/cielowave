services:
  cielowave-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cielowave-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cielowave.rule=Host(`cielowave-api.joaquinvasquez.com`)"
      - "traefik.http.routers.cielowave.entrypoints=websecure"
      - "traefik.http.routers.cielowave.tls.certresolver=cloudflare"
      - "traefik.http.services.cielowave.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.cielowave-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.cielowave-ratelimit.ratelimit.burst=20"
      - "traefik.http.routers.cielowave.middlewares=cielowave-ratelimit"
networks:
  web:
    external: true
